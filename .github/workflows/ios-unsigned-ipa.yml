name: iOS unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'GlutnnGxunuAssistant/**'
      - 'GlutnnGxunuAssistant.xcodeproj/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

# 只留最新一次构建：删旧构建需要 actions:write（默认 token 删不了 workflow run）。
permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications/ | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.app" ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
          swift --version

      - name: Build (unsigned)
        run: |
          xcodebuild -project GlutnnGxunuAssistant.xcodeproj \
            -target GlutnnGxunuAssistant \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app identity
        run: |
          APP="build/Products/GlutnnGxunuAssistant.app"
          test -d "$APP" || { echo "app not found at $APP"; find build -name "*.app" -type d; exit 1; }
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          APP="build/Products/GlutnnGxunuAssistant.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Glutnn-Gxunu-Assistant-Native-unsigned.ipa Payload
          ls -lh Glutnn-Gxunu-Assistant-Native-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glutnn-Gxunu-Assistant-Native-unsigned-ipa
          path: Glutnn-Gxunu-Assistant-Native-unsigned.ipa
          retention-days: 90

      # 只留最新一次构建：构建成功后删掉本 workflow 之前所有的 run（不含本次）。
      # continue-on-error：删失败也不让一次成功的构建变红。
      - name: Delete old workflow runs (keep only this build)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ios-unsigned-ipa.yml',
              per_page: 100
            });
            for (const run of runs) {
              if (run.id !== context.runId) {
                console.log(`Deleting run ${run.id} (${run.head_sha})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
